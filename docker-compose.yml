# Local stack: Qdrant + the LIBRAIN API.
#   cp .env.example .env    # then put your keys in .env (gitignored)
#   docker compose up --build
# API: http://localhost:5080 (5000 is often taken by macOS AirPlay Receiver).
# Data persists in the qdrant-data volume; `docker compose down -v` deletes it.
services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"   # REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC, used by the API
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build: .
    depends_on:
      - qdrant
    ports:
      - "5080:8080"
    environment:
      Qdrant__Host: qdrant
      Qdrant__Port: "6334"
      OpenAI__ApiKey: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env (needed for embeddings)}
      # Optional: only the OpenAI-only experiments run without it.
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}

volumes:
  qdrant-data:
