# Render Blueprint for the public LIBRAIN API (free web service), matching the live service
# https://librain.onrender.com: built by Render from this repository's Dockerfile on every
# commit to main that touches the API.
# To recreate it: Render dashboard, New, Blueprint, pick this repository. It asks for the two
# values marked sync: false (the Qdrant host and a READ-ONLY Qdrant key); nothing secret lives
# in the repo. No Anthropic or OpenAI key is configured: in public mode every visitor brings
# their own. The free instance sleeps after 15 minutes without traffic and wakes on the next
# request (up to about a minute).
services:
  - type: web
    name: librain
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt   # next to the Qdrant cluster; any region works
    branch: main
    autoDeploy: true
    buildFilter:
      paths:
        - LIBRAIN/**
        - Dockerfile
    healthCheckPath: /health
    envVars:
      - key: Public__Enabled
        value: "true"
      - key: Qdrant__Host
        sync: false
      - key: Qdrant__ApiKey
        sync: false
      - key: Qdrant__Port
        value: "6334"
      - key: Qdrant__UseHttps
        value: "true"
      - key: Cors__AllowedOrigins__0
        value: https://librain.erenmutlu.me
      - key: RateLimiting__PaidRequestsPerHour
        value: "30"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # The image listens on 8080; Render routes to $PORT.
      - key: PORT
        value: "8080"
      # Workstation GC: a smaller footprint on the free instance's 512 MB.
      - key: DOTNET_gcServer
        value: "0"
