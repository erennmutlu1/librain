<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="LIBRAIN proposes research hypotheses from a library of scientific papers, checks every citation against its source and flags every leap beyond the evidence."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The mobile browser bar follows the page background of each theme (tokens.css). -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LIBRAIN" />
    <meta property="og:title" content="LIBRAIN" />
    <meta
      property="og:description"
      content="Hypotheses from papers — every citation checked, every leap flagged. Ask a library of scientific papers for new ideas and audit each one sentence by sentence."
    />
    <meta property="og:url" content="https://librain.erenmutlu.me/" />
    <meta property="og:image" content="https://librain.erenmutlu.me/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Librain wordmark glowing in cyan, violet and magenta above the line: Hypotheses from papers — every citation checked, every leap flagged." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
    />
    <title>LIBRAIN</title>
    <script>
      // Apply a stored theme choice before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('librain.theme');
        if (t === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e0f11');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
