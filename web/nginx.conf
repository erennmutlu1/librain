server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # PDF uploads: the API accepts up to 50 MB.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Progress streams (text/event-stream) must reach the browser as they happen.
        proxy_buffering off;
        proxy_cache off;
        # A Discovery or Compare run can take a few minutes.
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Hashed build assets never change; the HTML shell must not be cached.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
