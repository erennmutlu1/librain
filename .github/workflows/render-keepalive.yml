name: Render keep-alive

# The live API runs on Render's free plan, which puts it to sleep after 15 minutes
# without a request; the next visitor then waits about a minute for it to wake.
# A GET /health every five minutes keeps it awake. Free: public-repository Actions
# minutes, and one always-on free service fits Render's 750 free hours a month.
# It never fails the run (a sleeping or slow Render would mail a failure every
# five minutes); the log shows each answer instead.

on:
  schedule:
    # Every five minutes, off the top of the hour, when GitHub delays schedules most.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # for the last step

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: GET /health
    if: vars.PUBLIC_DEMO == 'true' && vars.LIBRAIN_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the API
        env:
          API_URL: ${{ vars.LIBRAIN_API_URL }}
        run: |
          # A cold start takes up to a minute, so wait for it rather than give up.
          code=$(curl -s -m 120 -o /dev/null -w '%{http_code}' "${API_URL%/}/health" || true)
          echo "LIBRAIN API answered HTTP ${code:-none}"

      # GitHub switches off scheduled workflows in a public repository after 60 days with
      # no commits; re-enabling it on every run keeps the schedule alive between commits.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable render-keepalive.yml --repo "$GITHUB_REPOSITORY"
