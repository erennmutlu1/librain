name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test (no API keys required)
    runs-on: ubuntu-latest
    # Disposable Qdrant for the opt-in integration test (synthetic vectors, no API calls).
    services:
      qdrant:
        image: qdrant/qdrant:v1.17.1
        ports:
          - 6334:6334
    env:
      LIBRAIN_QDRANT_TEST_HOST: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LIBRAIN.sln

      - name: Build
        run: dotnet build LIBRAIN.sln --no-restore --nologo

      - name: Test (offline, no Anthropic/OpenAI/Qdrant keys)
        run: dotnet test LIBRAIN.Tests/LIBRAIN.Tests.csproj --no-build --nologo

  docker:
    name: Build API image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t librain-api:ci .

  web:
    name: Web UI (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
